name: Keep Render Backend Warm

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -sS --max-time 60 https://my-logic.onrender.com/api/health || curl -sS --max-time 60 https://my-logic.onrender.com/
