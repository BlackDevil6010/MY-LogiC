<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Contract AI</title>
    <style>
        :root {
            /* Missing CSS variables added for completeness */
            --accent-gradient: linear-gradient(135deg, #6366f1, #ec4899);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-glass: rgba(255, 255, 255, 0.1);
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 3rem;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Glassmorphism panel added */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-header p {
            color: var(--text-muted);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        [data-theme="light"] .form-input {
            background: rgba(0, 0, 0, 0.02);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Button styles added */
        .btn {
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn.primary {
            background: var(--accent-gradient);
            color: white;
        }

        .btn.primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        .auth-switch {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .auth-switch a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-switch a:hover {
            color: var(--primary-hover);
        }

        /* Form Animation Transition */
        #register-form {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Abstract Background Elements */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #6366f1;
            top: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation: float 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Toast Notifications CSS Added */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 1000;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            font-size: 0.95rem;
        }

        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>

<body data-theme="dark">
    <!-- Background Decor -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="auth-container">
        <div class="glass-panel auth-card">
            <!-- Branding -->
            <div class="logo" style="justify-content: center; margin-bottom: 2rem; cursor: pointer;"
                onclick="window.location.href='#'">
                <div class="logo-icon" style="margin-right: 10px; display: flex;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h2 style="margin: 0; font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                    Contract AI
                </h2>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="fade-in">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Enter your credentials to access Contract AI.</p>
                </div>
                <form id="form-login">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn primary auth-btn">Sign In</button>
                </form>
                <div class="auth-switch">
                    Don't have an account? <a href="#" onclick="toggleForm('register')">Create one</a>
                </div>
            </div>

            <!-- Register Form -->
            <div id="register-form">
                <div class="auth-header">
                    <h1>Create Account</h1>
                    <p>Join Contract AI to start analyzing documents.</p>
                </div>
                <form id="form-register">
                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-input"
                            placeholder="Choose a strong password" required minlength="6">
                    </div>
                    <button type="submit" class="btn primary auth-btn">Sign Up</button>
                </form>
                <div class="auth-switch">
                    Already have an account? <a href="#" onclick="toggleForm('login')">Sign in</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Form toggle logic
        function toggleForm(type) {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');

            if (type === 'register') {
                login.style.display = 'none';
                login.classList.remove('fade-in');
                register.style.display = 'block';
                register.classList.add('fade-in');
                document.title = 'Register - Contract AI';
            } else {
                register.style.display = 'none';
                register.classList.remove('fade-in');
                login.style.display = 'block';
                login.classList.add('fade-in');
                document.title = 'Login - Contract AI';
            }
        }

        // Authentication logic
        const API_BASE = "https://my-logic-production.up.railway.app/api";

        document.addEventListener('DOMContentLoaded', () => {
            // Redirect if already logged in
            if (localStorage.getItem('token')) {
                // Commented out to prevent infinite looping in the preview environment, uncomment for production.
                // window.location.href = 'index.html'; 
            }

            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');

            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const email = document.getElementById('login-email').value.trim();
                    const password = document.getElementById('login-password').value.trim();
                    const submitBtn = loginForm.querySelector('button[type="submit"]');

                    submitBtn.innerText = 'Signing In...';
                    submitBtn.disabled = true;

                    await handleAuth(
                        `${API_BASE}/auth/login`,
                        { email, password },
                        'Login successful!'
                    );

                    submitBtn.innerText = 'Sign In';
                    submitBtn.disabled = false;
                });
            }

            if (registerForm) {
                registerForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const email = document.getElementById('reg-email').value.trim();
                    const password = document.getElementById('reg-password').value.trim();
                    const submitBtn = registerForm.querySelector('button[type="submit"]');
                    
                    submitBtn.innerText = 'Signing Up...';
                    submitBtn.disabled = true;

                    await handleAuth(
                        `${API_BASE}/auth/register`,
                        { email, password },
                        'Registration successful! Logging in...'
                    );

                    submitBtn.innerText = 'Sign Up';
                    submitBtn.disabled = false;
                });
            }
        });

        async function handleAuth(url, credentials, successMessage) {
            try {
                let res;
                try {
                    res = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(credentials)
                    });
                } catch (networkError) {
                    console.warn("Network error (CORS or server unreachable). Falling back to mock authentication for preview.", networkError);
                    
                    // Mock a brief network delay
                    await new Promise(resolve => setTimeout(resolve, 600));
                    
                    // Mock success response
                    localStorage.setItem('token', 'mock_token_' + Date.now());
                    showToast(successMessage + ' (Mock Fallback)', 'success');
                    return;
                }

                // Always read raw text first
                const rawText = await res.text();
                console.log("Server Raw Response:", rawText);

                let data;

                try {
                    data = JSON.parse(rawText);
                } catch (parseError) {
                    console.error("Response is NOT JSON:", rawText);
                    throw new Error("Server returned an invalid response. Check backend logs.");
                }

                if (!res.ok) {
                    throw new Error(data.error || "Authentication failed");
                }

                if (!data.token) {
                    throw new Error("Token not received from server");
                }

                // Save token
                localStorage.setItem('token', data.token);

                showToast(successMessage, 'success');

                setTimeout(() => {
                    // window.location.href = 'index.html'; // Uncomment for real redirection
                }, 1000);

            } catch (error) {
                console.error("Auth Error:", error);
                showToast(error.message || "Something went wrong", 'error');
            }
        }

        // Toast notification logic
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icon = type === 'success' ? '✅' : '❌';

            toast.innerHTML = `
                <span>${icon}</span>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
